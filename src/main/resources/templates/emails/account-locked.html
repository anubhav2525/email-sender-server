<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Account Locked</title>
</head>

<body style="margin:0;background:#f4f7fb;font-family:Arial,Helvetica,sans-serif;">

<table width="100%" cellpadding="0" cellspacing="0" style="padding:40px 15px;">
    <tr>
        <td align="center">

            <table width="600" cellpadding="0" cellspacing="0"
                   style="max-width:600px;background:#ffffff;border-radius:12px;overflow:hidden;">

                <tr>
                    <td style="background:#dc2626;padding:32px;text-align:center;">

                        <div style="font-size:42px;color:#ffffff;">!</div>

                        <h1 style="margin:8px 0 0;color:#ffffff;font-size:24px;">
                            Account Locked
                        </h1>

                    </td>
                </tr>

                <tr>
                    <td style="padding:40px;">

                        <h2 style="margin:0 0 20px;color:#111827;">
                            Hello <span th:text="${fullName}">John Doe</span>,
                        </h2>

                        <p style="font-size:15px;line-height:1.7;color:#4b5563;">
                            Your account associated with
                            <strong th:text="${username}">john@example.com</strong>
                            has been temporarily locked.
                        </p>

                        <div style="margin:25px 0;padding:20px;background:#fef2f2;
                                    border:1px solid #fecaca;border-radius:8px;">

                            <p style="margin:0 0 8px;font-weight:bold;color:#991b1b;">
                                Reason
                            </p>

                            <p style="margin:0;font-size:14px;line-height:1.6;color:#7f1d1d;"
                               th:text="${reason}">
                                Security policy violation.
                            </p>

                        </div>

                        <p style="font-size:14px;line-height:1.7;color:#6b7280;">
                            If you believe this action was taken incorrectly, please
                            contact our support team for assistance.
                        </p>

                    </td>
                </tr>

                <tr>
                    <td style="background:#f8fafc;padding:25px;text-align:center;">

                        <p style="margin:0;font-size:13px;color:#6b7280;">
                            Contact support:
                            <a th:href="'mailto:' + ${supportEmail}"
                               th:text="${supportEmail}"
                               style="color:#2563eb;text-decoration:none;">
                                support@myapp.com
                            </a>
                        </p>

                        <p style="margin:10px 0 0;font-size:12px;color:#9ca3af;">
                            © <span th:text="${appName}">MyApp</span>
                        </p>

                    </td>
                </tr>

            </table>

        </td>
    </tr>
</table>

</body>
</html>
