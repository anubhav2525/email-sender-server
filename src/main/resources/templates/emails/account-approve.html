<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Account Approved</title>
</head>

<body style="margin:0;background:#f4f7fb;font-family:Arial,Helvetica,sans-serif;">

<table width="100%" cellpadding="0" cellspacing="0" style="padding:40px 15px;">
    <tr>
        <td align="center">

            <table width="600" cellpadding="0" cellspacing="0"
                   style="max-width:600px;background:#ffffff;border-radius:12px;overflow:hidden;">

                <tr>
                    <td style="background:#2563eb;padding:35px;text-align:center;">

                        <div style="font-size:44px;color:#ffffff;">✓</div>

                        <h1 style="margin:8px 0 0;color:#ffffff;font-size:25px;">
                            Account Approved
                        </h1>

                    </td>
                </tr>

                <tr>
                    <td style="padding:40px;">

                        <h2 style="margin:0 0 20px;color:#111827;">
                            Congratulations,
                            <span th:text="${fullName}">John Doe</span>!
                        </h2>

                        <p style="font-size:15px;line-height:1.7;color:#4b5563;">
                            Your account has been reviewed and approved by our team.
                        </p>

                        <div style="margin:30px 0;padding:25px;text-align:center;
                                    background:#eff6ff;border-radius:10px;">

                            <p style="margin:0;font-size:16px;font-weight:bold;color:#1d4ed8;">
                                Your account is now approved.
                            </p>

                            <p style="margin:10px 0 0;font-size:14px;color:#4b5563;">
                                You can now access the services available to you.
                            </p>

                        </div>

                        <p style="font-size:14px;line-height:1.7;color:#6b7280;">
                            Thank you for choosing
                            <strong th:text="${appName}">MyApp</strong>.
                            We're glad to have you with us.
                        </p>

                    </td>
                </tr>

                <tr>
                    <td style="background:#f8fafc;padding:25px;text-align:center;">

                        <p style="margin:0;font-size:13px;color:#6b7280;">
                            Support:
                            <a th:href="'mailto:' + ${supportEmail}"
                               th:text="${supportEmail}"
                               style="color:#2563eb;text-decoration:none;">
                                support@myapp.com
                            </a>
                        </p>

                        <p style="margin:10px 0 0;font-size:12px;color:#9ca3af;">
                            © <span th:text="${appName}">MyApp</span>
                        </p>

                    </td>
                </tr>

            </table>

        </td>
    </tr>
</table>

</body>
</html>
