
server:
  port: 8000 # Default PORT
  servlet:
    context-path: /api # Standard API PATH
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/plain
    min-response-size: 1024

spring:
  application:
    name: email
  profiles:
    active: prod # Sping application Environment

  # ----- Mail (overridden per profile) -------------------------
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
    default-encoding: UTF-8

  # ----- Datasource (overridden per profile) -------------------
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: CrmHikariPool
      minimum-idle: 2
      maximum-pool-size: 10
      connection-timeout: 30000        # ms
      idle-timeout: 600000
      max-lifetime: 1800000
      auto-commit: false

  # ----- Redis -------------------------------------------------
  data:
    redis:
      url: ${REDIS_URL}

  # ----- JPA ---------------------------------------------------
  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        use_sql_comments: false
        default_batch_fetch_size: 50
        jdbc:
          batch_size: 25
          order_inserts: true
          order_updates: true

  # ----- Flyway ------------------------------------------------
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
    out-of-order: false

  # ----- Thymeleaf ---------------------------------------------
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    encoding: UTF-8
    mode: HTML
    cache: true

  # ----- Security ----------------------------------------------
  security:
    require-ssl: false                # overridden to true in prod

  # ----- Async thread pool (used by @Async mail sending) -------
  task:
    execution:
      pool:
        core-size: 2
        max-size: 8
        queue-capacity: 500
      thread-name-prefix: async-mail-

# ----- Logging -----------------------------------------------
logging:
  level:
    # Existing
    org.springframework.security.config.annotation.authentication.configuration.InitializeUserDetailsBeanManagerConfigurer: ERROR

    # Add these temporarily
    org.springframework.messaging: DEBUG
    org.springframework.web.socket: DEBUG
    org.springframework.security.messaging: DEBUG
    org.springframework.web.socket.messaging: DEBUG

    # Optional (agar aur detail chahiye)
    org.springframework.messaging.simp.stomp: TRACE

# Redis TTL
redis:
  ttl:
    default: 3600

# ----- Actuator -----------------------------------------------
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,flyway
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
      show-components: when-authorized
  info:
    env:
      enabled: true

# ----- Application-level custom properties --------------------
app:
  name: ${APP_NAME:Email}
  base-url: ${APP_BASE_URL:http://localhost:8000}
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiry-ms: 900000          # 15 min
    refresh-token-expiry-ms: 604800000      # 7 days
    issuer: email-application
  mail:
    from: ${MAIL_FROM:no-reply@email-server.com}
    from-name: ${MAIL_FROM_NAME:EMAIL No reply}
    base-url: ${APP_BASE_URL}

  support-email: ${SUPPORT_EMAIL:support@bst.com}
  logo-url: ${APP_LOGO_URL:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
    allow-credentials: true
    max-age: 3600
